---
# `/` serves the website (including /api/auth and /api/backend, its server-side routes);
# `/api/v1` reaches the API server directly (used by gi-cli for operator commands; every
# endpoint there requires a GitHub token or an operator token).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: githubissuemanager-ngnix-ingress
  namespace: githubissuemanager
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: website
                port:
                  number: 3000
