---
# Schema migrations are applied by the API server on startup (sqlx), so no init script is needed.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresdb
  namespace: githubissuemanager
spec:
  selector:
    matchLabels:
      app: postgresdb
      service: postgresdb
  serviceName: postgresdb
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: postgresdb
        service: postgresdb
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        # `postgres` user in the alpine image; makes the volume writable for it.
        fsGroup: 70
      containers:
        - name: postgresdb
          # Pinned major version: a data directory cannot be opened by a different major version.
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: githubissuemanager-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: githubissuemanager-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: githubissuemanager-secret
                  key: POSTGRES_PASSWORD
            # Sub-directory: volume roots may contain lost+found, which initdb rejects.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1']
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1']
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: githubissuemanager-claim
      restartPolicy: Always
      volumes:
        - name: githubissuemanager-claim
          persistentVolumeClaim:
            claimName: githubissuemanager-claim
